name: monthly full resolve

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m radar.run --init
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: python -m radar.run --resolve --all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
