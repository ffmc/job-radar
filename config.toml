# A posting older than this is never stored, and is deleted on the next run.
# Boards that expose no posting date (Workday, BambooHR, Rippling) are aged from
# when this crawler first saw them - set keep_undated = false to drop them instead.
[freshness]
max_age_days = 20
keep_undated = true

regions = ["worldwide", "europe", "americas-europe"]

[titles]
include = [
  "analytics engineer",
  "business intelligence",
  "\\bbi\\b",
  "data analyst",
  "data & analytics",
  "data and analytics",
  "analytics (manager|lead|specialist|consultant|developer)",
  "semantic",
  "data solutions",
  "solutions? (engineer|architect|consultant)",
  "forward deployed",
  "data platform",
  "data engineer",
  "tableau",
  "power ?bi",
  "looker",
  "\\bdbt\\b",
]
exclude = [
  "\\bintern\\b",
  "internship",
  "working student",
  "apprentice",
  "\\bsales\\b",
  "account executive",
  "recruiter",
  "marketing manager",
  "customer success manager",
  "support (agent|specialist)",
]

# Applied at ingestion: a posting whose location matches none of `include`,
# or matches any of `exclude`, is never stored. Locations are free text from
# each board, so these are string rules, not a guarantee of work eligibility.
